services:
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.21.3}
    environment:
      CHARON_LOKI_ADDRESSES: ${CHARON_LOKI_ADDRESSES}
      CLUSTER_NAME: ${CLUSTER_NAME}
      CLUSTER_PEER: ${CLUSTER_PEER}
    # Alloy only reads logs and sends them on, so it needs no capabilities and writes only its rendered config and its data.
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks: [dvnode, docker-api]
    depends_on: [docker-socket-proxy]
    entrypoint: /etc/alloy/run.sh
    command: ["/bin/alloy", "run", "/tmp/config.alloy", "--storage.path=/var/lib/alloy/data", "--disable-reporting"]
    restart: unless-stopped

  # Gives Alloy only the Docker API calls it needs instead of the full Docker API (allowlist in docker-socket-proxy/haproxy.cfg).
  docker-socket-proxy:
    image: haproxy:${HAPROXY_VERSION:-3.2.26-alpine}
    # Root inside the container only so it can open the root-owned Docker socket; it has no capabilities and a read-only filesystem.
    user: "0:0"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [docker-api]
    restart: unless-stopped

networks:
  dvnode:
  # Only Alloy and the Docker socket proxy join this network, and it has no external access.
  docker-api:
    internal: true

volumes:
  alloy-data:
