# Override any defaults specified by `${FOO:-bar}` in `.env` with `FOO=qux`.
# ${VARIABLE:-default} evaluates to default if VARIABLE is unset or empty in the environment.
# ${VARIABLE-default} evaluates to default only if VARIABLE is unset in the environment.

# Before the selected VC starts, the vc-bundle service renders what it consumes into .charon/vc-bundle with
# `charon alpha vc-bundle`: its keystores, its proposer settings from vc-config/proposer-config.json and the flags a
# distributed validator needs (vc-flags.txt). Each VC mounts .charon read-only and copies the bundle into its own
# data directory. .charon is mounted rather than a subdirectory, since Docker would create a missing one as root
# before charon writes it. After the proposer config changes, run `docker compose up -d` rather than
# `docker compose restart <vc>`: only `up` renders the bundle again.

x-vc-depends-on: &vc-depends-on
  charon:
    condition: service_started
  vc-bundle:
    condition: service_completed_successfully

services:
  #                  _                     _ _
  # __   _____      | |__  _   _ _ __   __| | | ___
  # \ \ / / __|_____| '_ \| | | | '_ \ / _` | |/ _ \
  #  \ V / (_|_____| |_) | |_| | | | | (_| | |  __/
  #   \_/ \___|    |_.__/ \__,_|_| |_|\__,_|_|\___|

  vc-bundle:
    profiles: ["", vc-lodestar, vc-lighthouse, vc-nimbus, vc-prysm, vc-teku]
    image: obolnetwork/charon:${CHARON_VERSION:-v2.0.0-rc2}
    depends_on: [charon]
    entrypoint: /opt/vc-bundle/run.sh
    environment:
      VC: ${VC:-vc-lodestar}
    volumes:
      - ./vc-bundle/run.sh:/opt/vc-bundle/run.sh
      - .charon:/opt/charon/.charon
      # Lighthouse mounts the keystores at the same path, which its validator definitions point at.
      - .charon/validator_keys:/opt/charon/validator_keys:ro
    restart: "no"

  #  _           _           _
  # | | ___   __| | ___  ___| |_ __ _ _ __
  # | |/ _ \ / _` |/ _ \/ __| __/ _` | '__|
  # | | (_) | (_| |  __/\__ \ || (_| | |
  # |_|\___/ \__,_|\___||___/\__\__,_|_|

  vc-lodestar:
    profiles: [vc-lodestar]
    image: chainsafe/lodestar:${VC_LODESTAR_VERSION:-v1.50.1}
    depends_on: *vc-depends-on
    networks: [dvnode]
    entrypoint: /opt/lodestar/run.sh
    environment:
      BEACON_NODE_ADDRESS: http://charon:3600
      NETWORK: ${NETWORK}
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
      BUILDER_SELECTION: ${VC_LODESTAR_BUILDER_SELECTION:-builderalways}
    labels:
      - "alloy-monitored=${VC_LODESTAR_ALLOY_MONITORED:-true}"
    volumes:
      - ./lodestar/run.sh:/opt/lodestar/run.sh
      - .charon:/opt/charon/node:ro
      - ./data/lodestar:/opt/data # Keep data in lodestar and not vc-lodestar for backwards compatibility
    restart: unless-stopped

  #  _ _       _     _   _
  # | (_) __ _| |__ | |_| |__   ___  _   _ ___  ___
  # | | |/ _` | '_ \| __| '_ \ / _ \| | | / __|/ _ \
  # | | | (_| | | | | |_| | | | (_) | |_| \__ \  __/
  # |_|_|\__, |_| |_|\__|_| |_|\___/ \__,_|___/\___|
  #      |___/

  vc-lighthouse:
    profiles: [vc-lighthouse]
    image: sigp/lighthouse:${VC_LIGHTHOUSE_VERSION:-v8.3.3}
    depends_on: *vc-depends-on
    networks: [dvnode]
    entrypoint: /opt/lighthouse/run.sh
    environment:
      BEACON_NODE_ADDRESS: http://charon:3600
      NETWORK: ${NETWORK}
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    labels:
      - "alloy-monitored=${VC_LIGHTHOUSE_ALLOY_MONITORED:-true}"
    volumes:
      - ./lighthouse/run.sh:/opt/lighthouse/run.sh
      - .charon/validator_keys:/opt/charon/validator_keys
      - .charon:/opt/charon/node:ro
      - ./data/vc-lighthouse:/opt/data
    restart: unless-stopped

  #        _           _
  #  _ __ (_)_ __ ___ | |__  _   _ ___
  # | '_ \| | '_ ` _ \| '_ \| | | / __|
  # | | | | | | | | | | |_) | |_| \__ \
  # |_| |_|_|_| |_| |_|_.__/ \__,_|___/

  vc-nimbus:
    profiles: [vc-nimbus]
    image: statusim/nimbus-validator-client:${VC_NIMBUS_VERSION:-multiarch-v26.10.2}
    # Starts as root so run.sh can hand ./data/vc-nimbus to uid 1000; Nimbus itself runs as uid 1000.
    user: root
    entrypoint: /home/user/run.sh
    depends_on: *vc-depends-on
    networks: [dvnode]
    environment:
      BEACON_NODE_ADDRESS: http://charon:3600
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    labels:
      - "alloy-monitored=${VC_NIMBUS_ALLOY_MONITORED:-true}"
    volumes:
      - ./nimbus/run.sh:/home/user/run.sh
      - .charon:/opt/charon/node:ro
      - ./data/vc-nimbus:/home/user/data
    restart: unless-stopped

  #  _ __  _ __ _   _ ___ _ __ ___
  # | '_ \| '__| | | / __| '_ ` _ \
  # | |_) | |  | |_| \__ \ | | | | |
  # | .__/|_|   \__, |___/_| |_| |_|
  # |_|         |___/

  vc-prysm:
    profiles: [vc-prysm]
    image: offchainlabs/prysm-validator:${VC_PRYSM_VERSION:-v7.3.1}
    platform: "linux/amd64"
    depends_on: *vc-depends-on
    networks: [dvnode]
    entrypoint: /home/prysm/run.sh
    environment:
      BEACON_NODE_ADDRESS: http://charon:3600
      NETWORK: ${NETWORK}
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    labels:
      - "alloy-monitored=${VC_PRYSM_ALLOY_MONITORED:-true}"
    volumes:
      - ./prysm/run.sh:/home/prysm/run.sh
      - ./data/vc-prysm:/data/vc
      - .charon:/opt/charon/node:ro
    restart: unless-stopped

  #  _       _
  # | |_ ___| | ___   _
  # | __/ _ \ |/ / | | |
  # | ||  __/   <| |_| |
  #  \__\___|_|\_\\__,_|

  vc-teku:
    profiles: [vc-teku]
    # Teku reads builders from the proposer config only after 26.10.3: develop until the next release.
    image: consensys/teku:${VC_TEKU_VERSION:-develop}
    # Starts as root so run.sh can hand ./data/vc-teku to uid 1000; Teku itself runs as uid 1000.
    user: root
    depends_on: *vc-depends-on
    networks: [dvnode]
    entrypoint: /opt/teku/run.sh
    environment:
      BEACON_NODE_ADDRESS: http://charon:3600
      NETWORK: ${NETWORK}
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    labels:
      - "alloy-monitored=${VC_TEKU_ALLOY_MONITORED:-true}"
    volumes:
      - ./teku/run.sh:/opt/teku/run.sh
      - .charon:/opt/charon/node:ro
      - ./data/vc-teku:/home/data
    restart: unless-stopped
