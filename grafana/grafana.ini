# Grafana is published on 127.0.0.1 by default (see MONITORING_IP_GRAFANA). To view it from
# another machine use an SSH tunnel: ssh -L 3000:127.0.0.1:3000 <user>@<node>

# Anonymous users can view the provisioned dashboards but cannot change anything.
[auth.anonymous]
enabled = true
org_role = Viewer

# No password logins: dashboards and datasources are provisioned from files in this repo.
# This also disables the factory admin:admin account, including on existing data/grafana databases.
[auth]
disable_login_form = true

[auth.basic]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false

[security]
disable_gravatar = true
cookie_samesite = strict
# Only allow the datasource proxy to reach the provisioned monitoring backends.
data_source_proxy_whitelist = prometheus:9090 loki:3100 tempo:3200

[plugins]
plugin_admin_enabled = false
preinstall_disabled = true

[public_dashboards]
enabled = false

[snapshots]
enabled = false
