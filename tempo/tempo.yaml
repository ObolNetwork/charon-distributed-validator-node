server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 24h

backend_worker:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /opt/tempo/wal
    local:
      path: /opt/tempo/traces

usage_report:
  reporting_enabled: false
